# nginx server block for the built Vite bundle.
#
# Despite the name, this is a TEMPLATE and not a loadable config: `${PORT}` is
# substituted at container start, so nginx cannot parse this file as-is (and
# it is a bare server block, not a top-level nginx.conf with events/http).
# The Dockerfile copies it to /etc/nginx/templates/default.conf.template, where
# the stock nginx entrypoint (20-envsubst-on-templates.sh) runs envsubst over
# every *.template and writes the result to /etc/nginx/conf.d/ minus the
# suffix -- so it lands as default.conf, replacing the image's own server block
# that listens on 80. The .template suffix and that destination path are
# required by the entrypoint's glob; this file's local name is not.
#
# Only variables present in the environment are substituted, which is why the
# Dockerfile sets a default PORT: an unset PORT would emit a bare `listen ;`
# and nginx would refuse to start.

server {
    # Cloud Run assigns the port; the depoly app contract defaults it to 8080.
    listen      ${PORT};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_min_length 1024;
    # text/html is always gzipped and cannot be listed here.
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # Asset filenames are content-hashed by Vite, so they never change in place.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Keep the entry document uncached so a new deploy is picked up at once.
    # The SPA fallback below reaches this block: try_files' last argument and the
    # index directive both perform internal redirects, which re-run location
    # matching, so "/" and unknown routes get this header too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
